meta:
  title: "ONOS Clustering Alpha Demo"
  version: "1.0.2"
  description: "ONOS clustering topology and handover."
  author: "Le Huyen Trang, Massinissa Hamidi"
  date: "2026-02-26"

topology:
  controllers:
    - name: c1
      ip: 127.0.0.1
      port: 6653
      type: "RemoteController"
    - name: c2
      ip: 127.0.0.1
      port: 6654
      type: "RemoteController"
    - name: c3
      ip: 127.0.0.1
      port: 6655
      type: "RemoteController"

  propagation:
    model: logDistance #Log-Distance Path Loss Model: path loss increases logarithmically with distance.
    exp: 4.0

  stations:
    - name: sta1
      ip: 10.0.0.1/24
      position: "10,30,0"
      range: 20
      ssid: ssid-ap1

    - name: sta2
      ip: 10.0.0.2/24
      position: "20,30,0"
      range: 20
      ssid: ssid-ap2

    - name: sta3
      ip: 10.0.0.3/24
      position: "90,30,0"
      range: 20
      ssid: ssid-ap3

    - name: sta4
      ip: 10.0.0.4/24
      position: "100,30,0"
      range: 20
      ssid: ssid-ap4

  accessPoints:
    - name: ap1
      ssid: ssid-ap1
      channel: 1 # 2.4 GHz standard channels: 1, 6, 11 to minimize interference
      position: "15,50,0"
      controller: c1

    - name: ap2
      ssid: ssid-ap2
      channel: 6
      position: "45,50,0"
      controller: c1

    - name: ap3
      ssid: ssid-ap3
      channel: 11
      position: "95,50,0"
      controller: c2
    
    - name: ap4
      ssid: ssid-ap4
      channel: 1
      position: "150,50,0"
      controller: c2
    
    - name: ap5
      ssid: ssid-ap5
      channel: 6
      position: "200,50,0"
      controller: c3
    
    - name: ap6
      ssid: ssid-ap6
      channel: 11
      position: "250,50,0"
      controller: c3

  links:
    - node1: ap1
      node2: ap2
      bw: 50
    
    # Disable link to create a gap between ap2 and ap3 for handover testing

    - node1: ap2
      node2: ap3
      bw: 50
      enable: false 

    - node1: ap1
      node2: ap3
      bw: 50
      enable: false 

    - node1: ap3
      node2: ap4
      bw: 50

    - node1: ap5
      node2: ap6
      bw: 50
