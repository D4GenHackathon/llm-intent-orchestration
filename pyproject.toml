[tool.poetry]
name = "llm-intent-orchestration"
version = "0.1.0"
description = "Simple LLM for medical user intent in biomedical environment"
authors = ["Huyen-Trang Le", "Nguyen-Huong-Giang Le", "Massinissa Hamidi"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10.0,<3.12"
python-dotenv = "1.0.0"
httpx = "^0.28.1"
mcp = "^1.26.0"
fastmcp = "^0.1.0"
crewai = "^0.50.0"
langchain-google-genai = "^0.1.0"
pyowm = '3.3.0'
tools = "^0.1.9"
aiofiles = "^23.2.1"
pyyaml = "^6.0"
openai = "^1.0.0"

# mininet-wifi dependencies
matplotlib = "^3.10.0"
bitstring = "^4.3.0"
bitarray = "^3.8.0"
beautifulsoup4 = "^4.14.0"
FlightRadarAPI = "^1.4.0"
fastapi = "^0.133.1"
uvicorn = "^0.41.0"
pydantic = "^2.12.5"
influxdb-client = "^1.18.0"  # InfluxDB Python client
pandas = "^2.0.0"  # Data processing for CSV import

# syntax error check 
[tool.pyright]
# https://github.com/microsoft/pyright/blob/main/docs/configuration.md
useLibraryCodeForTypes = true
exclude = [".cache"]

# styling issue check 
[tool.ruff]
# https://beta.ruff.rs/docs/configuration/
select = ['E', 'W', 'F', 'I', 'B', 'C4', 'ARG', 'SIM']
ignore = ['W291', 'W292', 'W293']

# python tool management depencies
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"